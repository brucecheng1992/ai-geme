      - run: npm test

  required:
    name: required
    runs-on: ubuntu-latest
    needs:
      - safety-guards
      - contract-tests
      - typecheck
      - full-test
    if: always()
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          echo "safety-guards: ${{ needs.safety-guards.result }}"
          echo "contract-tests: ${{ needs.contract-tests.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "full-test: ${{ needs.full-test.result }}"

          test "${{ needs.safety-guards.result }}" = "success"
          test "${{ needs.contract-tests.result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs.full-test.result }}" = "success"
